<text x="155" y="692" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#1e3a8a" font-weight="400" text-anchor="start">P21 SDA · P22 SCL  →  LCD 1602 + DS3231</text>
<text x="155" y="714" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#475569" font-weight="400" text-anchor="start">Энкодер эти пины не занимает</text>
<text x="140" y="756" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#94a3b8" font-weight="400" text-anchor="start">Только задействованные пины — ищи подписи на плате</text>
