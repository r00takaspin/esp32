<rect x="752" y="474" width="178" height="27" rx="13.5" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
<text x="841.0" y="492.36" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#f59e0b" font-weight="700" text-anchor="middle">P32  ↔  CLK</text>
<rect x="100" y="819" width="430" height="150" rx="16" fill="#0f172a" opacity="0.1" filter="url(#blur)"/>
<rect x="100" y="812" width="430" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<circle cx="130" cy="843" r="14" fill="#dc2626"/>
<text x="130" y="848" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="154" y="849" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#dc2626" font-weight="700" text-anchor="start">Питание</text>
<text x="125" y="880" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.2" fill="#334155" font-weight="400" text-anchor="start">• KY-040 — только от 3.3 В, не от 5 В.</text>
<text x="125" y="902" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.2" fill="#334155" font-weight="400" text-anchor="start">• Иначе подтяжки модуля подадут 5 В</text>
<text x="125" y="924" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.2" fill="#334155" font-weight="400" text-anchor="start">  на GPIO32 / 33 / 25 — это опасно.</text>
<text x="125" y="946" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.2" fill="#334155" font-weight="400" text-anchor="start">• 10 кОм уже на модуле, внешние не нужны.</text>
<rect x="550" y="819" width="430" height="150" rx="16" fill="#0f172a" opacity="0.1" filter="url(#blur)"/>
<rect x="550" y="812" width="430" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<circle cx="580" cy="843" r="14" fill="#2563eb"/>
<text x="580" y="848" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="604" y="849" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">Управление</text>
<text x="575" y="880" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.2" fill="#334155" font-weight="400" text-anchor="start">• Поворот — предыдущий / следующий аккаунт.</text>
<text x="575" y="902" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.2" fill="#334155" font-weight="400" text-anchor="start">• Нажатие — пробуждение; наяву — следующий.</text>
<text x="575" y="924" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.2" fill="#334155" font-weight="400" text-anchor="start">• 60 секунд бездействия — экран гаснет.</text>
<text x="575" y="946" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.2" fill="#334155" font-weight="400" text-anchor="start">• Будит только кнопка SW (GPIO25).</text>
<rect x="1000" y="819" width="500" height="150" rx="16" fill="#0f172a" opacity="0.1" filter="url(#blur)"/>
<rect x="1000" y="812" width="500" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<circle cx="1030" cy="843" r="14" fill="#0d9488"/>
<text x="1030" y="848" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="1054" y="849" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#0d9488" font-weight="700" text-anchor="start">Шина I²C — без изменений</text>
<text x="1025" y="880" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.2" fill="#334155" font-weight="400" text-anchor="start">• LCD 1602: SDA→P21, SCL→P22, VCC→5 В.</text>
<text x="1025" y="902" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.2" fill="#334155" font-weight="400" text-anchor="start">• DS3231: SDA→P21, SCL→P22, VCC→3V3.</text>
<text x="1025" y="924" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.2" fill="#334155" font-weight="400" text-anchor="start">• Энкодер занимает P32, P33, P25 —</text>
<text x="1025" y="946" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.2" fill="#334155" font-weight="400" text-anchor="start">  шину I²C и RTC не трогает.</text>
<text x="100" y="992" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="start">Порядок выводов на разных платах KY-040 отличается — ориентируйся на подписи GND, +, SW, DT, CLK.</text>
</svg>
